stages:
  - build
  - release

build-package:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip
  script:
    - mkdir -p dist
    - |
      zip -r dist/opencapture-${CI_COMMIT_TAG:-latest}.zip \
        manifest.json \
        content.js \
        service-worker.js \
        LICENSE \
        README.md \
        README.pt-BR.md \
        THIRD_PARTY_LICENSES.md \
        _locales \
        assets \
        html \
        -x "*.git*"
  artifacts:
    name: "opencapture-${CI_COMMIT_TAG:-latest}"
    paths:
      - dist/*.zip
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
