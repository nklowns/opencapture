/* Global base */
html,body{
	width:100%;
	height:100%;
	background-color: #f2f2f2;
	color: #333;
}
a{cursor:pointer;color: #007bff;text-decoration: none;}
a:hover{
	color: #007bff;
}

h1{font-size:1.6rem !important;}
h2{font-size:1.2rem !important;}

.btn-lg{width:100%;font-size:1rem !important;}
.rounded-y{border-radius: 2rem !important;}
.forOther { color: #d3d3d3 !important;}
.forOther2 { color: #A2A2A2 !important;}
.forOther2 a{ color: #A2A2A2 !important;}

.colorb {
	color:#007bff;
}
.colorb a{
	color:#007bff;
}
.colorb :hover{
	font-weight: bold;
}

.colorw {
	color:#fff !important;
}
.colorw :hover{
	color: #eee !important;
}
.colorw a{
	color:#fff !important;
}
.colorw a:hover{
	color: #f8f8f8 !important;
}

.nav-tabs {
	border-bottom: 1px solid #e6e6e6;
}
.card-header-tabs {
    border-bottom: 0;
}
.nav-tabs > li > a {
	margin-right: 0;
	color: #888;
	border-radius: 0;
}
.nav-tabs > li > a:hover,
.nav-tabs > li > a:focus {
	border-color: transparent;
	color: #333;
}
.nav-tabs.nav-tabs-solid > li > a {
	color: #333;
}
.nav-tabs.nav-tabs-solid > .active > a,
.nav-tabs.nav-tabs-solid > .active > a:hover,
.nav-tabs.nav-tabs-solid > .active > a:focus {
	background-color: #2962ff;
	border-color: #2962ff;
	color: #fff;
}
#saveFavErrorMsg{
	background: #fffbea;
	border-radius: 6px;
}

.full-height {
	height: 100%;
}
.header {
	line-height: 50px;
	color: white;
	border-bottom: 1px solid #717f8c;
}
.header-content {
	display: flex;
	align-items: center;
}
.save-card {
	color:#333;
}

.fixed-bottom-bar {  
    position: fixed;
	z-index: 10000;
    bottom: 0;  
    left: 0;  
    width: 100%;
    color: white;  
    display: flex;  
    justify-content: center;  
    align-items: center;  
    padding: 10px 0; 
	background-color: rgba(51, 51, 51, 0.8);
	box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.5); 
}  
.fixed-bottom-bar button {  
    margin: 0 10px; 
} 

.or-container {
    align-items: center;
    color: #ccc;
    display: flex;
	margin: 10px 0;
}
.or-container .line-separator {
    background-color: #ececec;
    flex-grow: 5;
    height: 1px;
}
.or-container .or-label {
    flex-grow: 1;
    margin: 0 15px;
    text-align: center;
	font-size: .8rem;
}

.content .shot-image {
	box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
}

</style>
